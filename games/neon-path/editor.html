<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Path — Level Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #06060f; color: #e0e0e0; font-family: monospace; font-size: 13px; overflow: hidden; }

    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    #header {
      display: flex; align-items: center; gap: 12px; padding: 6px 12px;
      background: #0a0a20; border-bottom: 1px solid #00bfff44;
      flex-shrink: 0;
    }
    #header h1 { color: #00bfff; font-size: 14px; letter-spacing: 2px; margin-right: 8px; }
    .level-btn {
      background: #0d1a2e; border: 1px solid #00bfff44; color: #8cc; padding: 3px 10px;
      cursor: pointer; border-radius: 3px; font-family: monospace; font-size: 12px;
    }
    .level-btn.active { background: #00bfff22; border-color: #00bfff; color: #00e5ff; }
    .level-btn:hover { border-color: #00bfff88; }
    #level-name-input {
      background: transparent; border: none; border-bottom: 1px solid #00bfff44; color: #00e5ff;
      font-family: monospace; font-size: 13px; width: 160px; outline: none;
    }
    #header-right { margin-left: auto; display: flex; gap: 8px; }
    .hbtn {
      background: #0d1a2e; border: 1px solid #00bfff44; color: #8cc; padding: 3px 10px;
      cursor: pointer; border-radius: 3px; font-family: monospace; font-size: 12px;
    }
    .hbtn:hover { background: #00bfff22; border-color: #00bfff88; }

    /* ── Main layout ── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── Toolbar ── */
    #toolbar {
      width: 110px; background: #080818; border-right: 1px solid #00bfff22;
      display: flex; flex-direction: column; padding: 8px; gap: 4px; overflow-y: auto; flex-shrink: 0;
    }
    .tool-btn {
      background: #0d1a2e; border: 1px solid #00bfff22; color: #aaa;
      padding: 6px 4px; cursor: pointer; border-radius: 4px; text-align: center;
      font-family: monospace; font-size: 11px; line-height: 1.5;
      transition: all 0.1s;
    }
    .tool-btn:hover { border-color: #00bfff66; color: #ddd; }
    .tool-btn.active { background: #00bfff22; border-color: #00bfff; color: #00e5ff; }
    .tool-sep { height: 1px; background: #00bfff22; margin: 4px 0; }
    .tool-hint { color: #444; font-size: 10px; text-align: center; padding: 2px; }

    /* ── Canvas wrapper ── */
    #canvas-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #06060f; overflow: hidden; position: relative;
    }
    #editor-canvas { cursor: crosshair; display: block; }
    #coords { position: absolute; bottom: 8px; left: 8px; color: #444; font-size: 11px; }

    /* ── Properties ── */
    #properties {
      width: 220px; background: #080818; border-left: 1px solid #00bfff22;
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .section-title {
      background: #0a0a20; border-bottom: 1px solid #00bfff22; padding: 6px 10px;
      color: #00bfff; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    }
    .prop-row { display: flex; align-items: center; padding: 4px 10px; gap: 6px; }
    .prop-label { color: #778; font-size: 11px; width: 56px; flex-shrink: 0; }
    .prop-input {
      flex: 1; background: #0d1a2e; border: 1px solid #00bfff22; color: #dde;
      padding: 2px 6px; font-family: monospace; font-size: 12px; border-radius: 3px; outline: none;
    }
    .prop-input:focus { border-color: #00bfff; }
    #delete-btn {
      margin: 8px 10px; background: #2a0808; border: 1px solid #ff206044; color: #ff6060;
      padding: 5px; cursor: pointer; border-radius: 3px; font-family: monospace; font-size: 12px;
    }
    #delete-btn:hover { background: #3a0d0d; border-color: #ff2060aa; }
    #no-sel { color: #444; padding: 12px 10px; font-size: 11px; text-align: center; }

    /* ── JSON panel ── */
    #json-panel {
      border-top: 1px solid #00bfff22; padding: 8px; display: flex; flex-direction: column; gap: 4px;
    }
    #json-title { color: #00bfff; font-size: 11px; letter-spacing: 1px; }
    #json-output {
      flex: 1; background: #0a0a1a; border: 1px solid #00bfff22; color: #8bc;
      font-family: monospace; font-size: 10px; padding: 6px; resize: none; outline: none;
      min-height: 120px; max-height: 200px;
    }
    .json-btns { display: flex; gap: 4px; }
    .jbtn {
      flex: 1; background: #0d1a2e; border: 1px solid #00bfff44; color: #8cc;
      padding: 4px; cursor: pointer; border-radius: 3px; font-family: monospace; font-size: 11px;
    }
    .jbtn:hover { background: #00bfff22; }
    #copy-msg { color: #00ff88; font-size: 10px; text-align: center; display: none; }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div id="header">
    <h1>NEON PATH EDITOR</h1>
    <span style="color:#445;font-size:11px">Level:</span>
    <div id="level-tabs" style="display:flex;gap:4px"></div>
    <span style="color:#445;font-size:11px;margin-left:12px">Name:</span>
    <input id="level-name-input" type="text" placeholder="Level name" />
    <div id="header-right">
      <button class="hbtn" id="reset-btn">Reset Level</button>
      <button class="hbtn" id="new-level-btn">+ New Level</button>
      <a href="/" style="text-decoration:none"><button class="hbtn">Play Game</button></a>
    </div>
  </div>

  <div id="main">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="tool-hint">TOOLS</div>
      <button class="tool-btn" data-tool="select">Select<br><span style="color:#555">V</span></button>
      <div class="tool-sep"></div>
      <div class="tool-hint">STATIC</div>
      <button class="tool-btn" data-tool="platform">Platform<br><span style="color:#00bfff55">P</span></button>
      <button class="tool-btn" data-tool="spike">Spike<br><span style="color:#ff206055">S</span></button>
      <button class="tool-btn" data-tool="door">Door<br><span style="color:#00ff8855">D</span></button>
      <button class="tool-btn" data-tool="spawn">Spawn<br><span style="color:#fff5">W</span></button>
      <div class="tool-sep"></div>
      <div class="tool-hint">OBSTACLES</div>
      <button class="tool-btn" data-tool="movingPlatform">Moving<br>Platform<br><span style="color:#00e5ff55">M</span></button>
      <button class="tool-btn" data-tool="laser">Laser<br><span style="color:#ff440055">L</span></button>
      <button class="tool-btn" data-tool="saw">Saw<br>Blade<br><span style="color:#ff00cc55">A</span></button>
      <button class="tool-btn" data-tool="firePillar">Fire<br>Pillar<br><span style="color:#ff660055">F</span></button>
      <button class="tool-btn" data-tool="acidDrop">Acid<br>Drop<br><span style="color:#39ff1455">C</span></button>
      <button class="tool-btn" data-tool="orbitBlade">Orbit<br>Blade<br><span style="color:#ff990055">O</span></button>
      <button class="tool-btn" data-tool="turret">Turret<br><span style="color:#ff303055">T</span></button>
      <button class="tool-btn" data-tool="crusher">Crusher<br><span style="color:#9933ff55">R</span></button>
      <div class="tool-sep"></div>
      <div class="tool-hint">Del = delete<br>Esc = deselect<br>Ctrl+Z = undo</div>
    </div>

    <!-- Canvas -->
    <div id="canvas-wrap">
      <canvas id="editor-canvas"></canvas>
      <div id="coords">0, 0</div>
    </div>

    <!-- Properties + JSON -->
    <div id="properties">
      <div class="section-title">Properties</div>
      <div id="prop-content">
        <div id="no-sel">Click an element to select it,<br>or use a tool to place one.</div>
      </div>
      <div id="json-panel">
        <div id="json-title">JSON EXPORT</div>
        <textarea id="json-output" readonly></textarea>
        <div class="json-btns">
          <button class="jbtn" id="copy-btn">Copy</button>
          <button class="jbtn" id="import-btn">Import</button>
        </div>
        <div id="copy-msg">Copied!</div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
