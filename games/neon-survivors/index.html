<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Neon Survivors</title>
  <!-- Telegram Mini App SDK — must load first to initialize window.Telegram.WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Platform SDKs — loaded conditionally -->
  <script>
    if (location.hostname.includes('yandex.net')) {
      var s = document.createElement('script');
      s.src = 'https://yandex.ru/games/sdk/v2';
      document.head.appendChild(s);
    }
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
      var s = document.createElement('script');
      s.src = 'https://sad.adsgram.ai/js/sad.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; overflow: clip; overscroll-behavior: none; touch-action: none; background: #0a0a1a; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    // Prevent pull-to-refresh, context menu, and text selection (Yandex 1.10.2, 1.6.1.8, 1.6.2.7)
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    document.addEventListener('selectstart', function(e) { e.preventDefault(); });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
